<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açar</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="stylesheet" href="style.css?v=1.3">

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
</head>
<body>

    <header>
        <div class="logo-title">🔑 Açar Bazası</div>
    </header>

    <!-- Axtarış sahəsi -->
    <input type="text" id="searchInput" class="search-box" placeholder="Marka veya Model axtar...">

    <!-- Açarların siyahısı (2-li grid) -->
    <div class="key-grid" id="keyContainer">
      <div class="spinner"><div></div><div></div><div></div></div>
    </div>

    <!-- Sağ aşağı küncdə sabit + düyməsi -->
    <button class="fab-btn" id="openModalBtn">+</button>

    <!-- Yeni Açar Əlavə Etmə / Redaktə Etmə Modalı -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-content">
            <h2 id="modalTitle">Yeni Açar Əlavə Et</h2>
            <form id="addKeyForm">
                <input type="hidden" id="editKeyId">
                <div class="brand-input-container">
    <input type="text" id="brandInput" placeholder="Marka (məs: Toyota)" autocomplete="off" required>
    <div id="brandSuggestions" class="suggestions-box"></div>
</div>
                <input type="text" id="modelInput" placeholder="Model (məs: Camry)" required>
                <input type="number" id="yearsInput" placeholder="İli" required>
                <input type="text" id="chipsInput" inputmode="numeric" pattern="[0-9]*" placeholder="Çip (məs: ID46)">
                
                <!-- Şəkil linki, Fayl və Kamera sahəsi yan-yana -->
                <div class="image-input-group">
                    <input type="url" id="imageInput" placeholder="Şəkil linki (URL) və ya Fayl/Kamera" required>
                    <label for="imageFileInput" class="file-upload-btn" title="Fayldan şəkil seç">📁</label>
                    <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
                    
                    <label for="cameraInput" class="file-upload-btn" title="Kameradan şəkil çək">📷</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                </div>
                
                <textarea id="noteInput" class="large-note-input" placeholder="Qeyd" rows="3"></textarea>
                
                <div class="modal-buttons">
                    <button type="submit" class="btn-save" id="saveBtnText">Yadda Saxla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Açar Detal Modalı -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content detail-content">
            <img id="detailImage" src="" alt="Açar şəkli" class="detail-image">
            <h2 id="detailTitle">Marka Model</h2>
            
            <!-- Əsas məlumatlar bloku -->
            <div class="detail-info-box">
                <p><strong>İl:</strong> <span id="detailYears"></span></p>
                <p><strong>Çip:</strong> <span id="detailChips"></span></p>
            </div>

            <!-- Sirf qeyd üçün ayrılmış ikinci blok -->
<div id="detailNoteContainer" class="detail-note-box" style="display: none; position: relative;">
    <div class="note-label">📝 Qeyd:</div>
    <p id="detailNote" style="padding-right: 35px;"></p>
    <span id="openNoteModalBtn" class="note-edit-icon" title="Qeydi redaktə et">✏️</span>
</div>

           <!-- Detal modalı daxilində idarəetmə düymələri (Redaktə, Sil) -->
<div class="modal-buttons detail-action-buttons">
    <button type="button" class="btn-edit" id="editKeyBtn">Redaktə</button>
    <button type="button" class="btn-delete" id="deleteKeyBtn">Sil</button>
</div>
        </div>
    </div>

    <!-- Şəkil Böyütmə Modalı -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content image-modal-content">
            <img id="fullImage" src="" alt="Böyük açar şəkli">
        </div>
    </div>

   <!-- Yalnız Qeyd Redaktə Etmə Modalı -->
<div class="modal-overlay" id="noteModal">
    <div class="modal-content">
        <h2>Qeydi Redaktə Et</h2>
        <form id="editNoteForm">
            <textarea id="quickNoteInput" class="large-note-input" placeholder="Qeyd yazın..." rows="4"></textarea>
            <div class="modal-buttons" style="margin-top: 15px;">
                <button type="submit" class="btn-save">Yadda Saxla</button>
            </div>
        </form>
    </div>
</div>

    <!-- JavaScript faylları -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js?v=1.3"></script>

   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('Service Worker qeydiyyatdan keçdi:', reg.scope))
                .catch((err) => console.log('Service Worker xətası:', err));
        });
    }
</script>

</body>
</html>
