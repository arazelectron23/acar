<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açar</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="stylesheet" href="style.css?v=2.0">

    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
</head>
<body>

    <header>
        <div class="logo-title">🔑 Açar</div>
    </header>

    <!-- Axtarış sahəsi -->
    <input type="text" id="searchInput" class="search-box" placeholder="Axtar...">
    
    <!-- Markaya görə filtr düyməsi -->
    <div class="brand-filter-container">
        <button id="filterByBrandBtn" class="brand-filter-btn">Marka seç</button>
    </div>

    <!-- Açarların siyahısı (2-li grid) -->
    <div class="key-grid" id="keyContainer">
      <div class="spinner"><div></div><div></div><div></div></div>
    </div>

    <!-- Sağ aşağı küncdə sabit + düyməsi -->
    <button class="fab-btn" id="openModalBtn">+</button>

    <!-- Yeni Açar Əlavə Etmə / Redaktə Etmə Modalı -->
    <div class="modal-overlay" id="keyModal">
        <div class="modal-content">
            <h2 id="modalTitle">Yeni Açar</h2>
            <form id="addKeyForm">
                <input type="hidden" id="editKeyId">
                <div style="margin-bottom: 1px;" class="brand-input-container">
                    <input type="text" id="brandInput" placeholder="Marka seçin..." readonly required style="cursor: pointer; background-color: #121212; color: #fff; padding-right: 35px;">
                    <span class="select-arrow">▼</span>
                </div>
                <input type="text" id="modelInput" placeholder="Model" required>
                <input type="number" id="yearsInput" placeholder="İli" required>
                <input type="text" id="chipsInput" inputmode="numeric" pattern="[0-9]*" placeholder="Çip (məs: ID46)">
                
                <!-- Şəkil linki, Fayl və Kamera sahəsi yan-yana -->
                <div class="image-input-group">
                    <input type="url" id="imageInput" placeholder="Şəkil linki və ya Fayl/Kamera" required>
                    <label for="imageFileInput" class="file-upload-btn" title="Fayldan şəkil seç">📁</label>
                    <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
                    
                    <label for="cameraInput" class="file-upload-btn" title="Kameradan şəkil çək">📷</label>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                </div>
                <input type="number" id="priceInput" placeholder="Qiymət (AZN)" step="0.01">
                
                <textarea id="noteInput" class="large-note-input" placeholder="Qeyd" rows="3"></textarea>
                
                <div class="modal-buttons">
                    <button type="submit" class="btn-save" id="saveBtnText">Yadda Saxla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Açar Detal Modalı -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content detail-content">
            <img id="detailImage" src="" alt="Açar şəkli" class="detail-image">
            <h2 id="detailTitle">Marka Model</h2>
            
            <!-- Əsas məlumatlar bloku -->
          <div class="detail-info-box">
    <div class="detail-badge-box">
        <span class="detail-label">İl</span>
        <span id="detailYears"></span>
    </div>
    <div class="detail-badge-box" id="detailChipsContainer">
        <span class="detail-label">Çip</span>
        <span id="detailChips">İD</span>
    </div>
    <div class="detail-badge-box" id="detailPriceContainer">
        <span class="detail-label">Qiymət</span>
        <span><span id="detailPrice"></span> AZN</span>
    </div>
</div>
            <!-- Sirf qeyd üçün ayrılmış ikinci blok -->
<div id="detailNoteContainer" class="detail-note-box" style="display: none; position: relative;">
    <div class="note-label">📝 Qeyd:</div>
    <p id="detailNote" style="padding-right: 35px;"></p>
    <span id="openNoteModalBtn" class="note-edit-icon" title="Qeydi redaktə et">✏️</span>
</div>

           <!-- Detal modalı daxilində idarəetmə düymələri (Redaktə, Sil) -->
<div class="modal-buttons detail-action-buttons">
    <button type="button" class="btn-edit" id="editKeyBtn">Redaktə</button>
    <button type="button" class="btn-delete" id="deleteKeyBtn">Sil</button>
</div>
        </div>
    </div>

    <!-- Şəkil Böyütmə Modalı -->
    <div class="modal-overlay" id="imageModal">
        <div class="modal-content image-modal-content">
            <img id="fullImage" src="" alt="Böyük açar şəkli">
        </div>
    </div>

   <!-- Yalnız Qeyd Redaktə Etmə Modalı -->
<div class="modal-overlay" id="noteModal">
    <div class="modal-content">
        <h2>Qeydi Redaktə Et</h2>
        <form id="editNoteForm">
            <textarea id="quickNoteInput" class="large-note-input" placeholder="Qeyd yazın..." rows="4"></textarea>
            <div class="modal-buttons" style="margin-top: 15px;">
                <button type="submit" class="btn-save">Yadda Saxla</button>
            </div>
        </form>
    </div>
</div>

<!-- Marka Seçim Modalı -->
<div class="modal-overlay" id="brandSelectModal">
    <div class="modal-content" style="max-height: 80dvh;">
        <h2 style="font-size: 16px; margin-bottom: 10px; text-align: center;">Marka Seçin</h2>
        
        <input type="text" id="filterBrandSearchInput" placeholder="Marka axtar..." style="width: 100%; padding: 10px 12px; margin-bottom: 10px; background-color: #222; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; font-size: 14px; flex-shrink: 0;">
        
        <div id="brandSelectList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 0;">
            <!-- Dinamik dolacaq -->
        </div>
        <button type="button" id="clearBrandFilter" class="btn-delete" style="margin-top: 10px; width: 100%; display: none; flex-shrink: 0;">Seçimi sıfırla</button>
    </div>
</div>

   <!-- Seçim Modalı (+ düyməsinə basanda açılacaq) -->
    <!-- Seçim Modalı (+ düyməsinə basanda açılacaq) -->
    <div class="modal-overlay" id="choiceModal">
        <div class="modal-content" style="max-width: 300px; text-align: center; display: flex; flex-direction: column; gap: 14px; background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 24px 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <h2 style="font-size: 18px; font-weight: 600; color: #f4f4f5; margin-bottom: 4px;">Yeni Əlavə Et</h2>
            
            <button type="button" id="chooseAddKey" class="btn-option" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #10b981); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);">
                <span>🔑</span> Açar
            </button>
            
            <button type="button" id="chooseAddBrand" class="btn-option" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);">
                <span>🏷️</span> Marka
            </button>
        </div>
    </div>

    <div id="brandAddModal" class="modal-overlay">
    <div class="modal-content">
        <h2>Marka</h2>
        <form id="addBrandForm">
            <input type="text" id="newBrandInput" placeholder="Markanın adı" required>
            <button type="submit" class="btn-save" id="saveBrandBtn">Yadda Saxla</button>
        </form>
        
        <!-- Mövcud markaların siyahısının görünəcəyi hissə -->
        <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
            <p style="font-size: 13px; color: #999; margin-bottom: 10px;">Mövcud Markalar:</p>
            <div id="existingBrandsList" style="max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
        </div>
    </div>
</div>

 <div id="keyBrandSelectModal" class="modal-overlay">
    <div class="modal-content" style="display: flex; flex-direction: column; max-height: 80vh;">
        <h2 style="font-size: 16px; margin-bottom: 15px; text-align: center;">Marka Seçin</h2>
        
        <!-- BURANI ƏLAVƏ EDİN -->
        <input type="text" id="brandSearchInput" placeholder="Marka axtar..." style="width: 100%; padding: 10px 12px; margin-bottom: 15px; background-color: #222; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; font-size: 14px;">
        
        <div id="keyBrandSelectList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1;">
            <!-- Siyahı bura gəlir -->
        </div>
    </div>
</div>

<!-- Marka Adını Dəyişmə Modalı -->
<div class="modal-overlay" id="editBrandModal">
    <div class="modal-content">
        <h2>Marka Adını Dəyiş</h2>
        <form id="editBrandForm">
            <input type="text" id="editBrandNameInput" placeholder="Markanın yeni adı..." required style="width: 100%; padding: 12px 15px; background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px; color: var(--primary-color); font-size: 15px; outline: none; margin-bottom: 12px;">
            <div class="modal-buttons">
                <button type="submit" class="btn-save">Yadda Saxla</button>
            </div>
        </form>
    </div>
</div>

    <!-- JavaScript faylları -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js?v=2.0"></script>

   <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((reg) => console.log('Service Worker qeydiyyatdan keçdi:', reg.scope))
                .catch((err) => console.log('Service Worker xətası:', err));
        });
    }
</script>

</body>
</html>
